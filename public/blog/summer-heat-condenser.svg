<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A rooftop condensing unit baking under the East Texas summer sun with the temperature in triple digits">
  <rect width="1200" height="630" fill="#0B1520"/>

  <!-- sun -->
  <circle cx="230" cy="170" r="110" fill="#F2A93B" opacity="0.15"/>
  <circle cx="230" cy="170" r="78" fill="#F2A93B"/>
  <circle cx="230" cy="170" r="60" fill="#F7BE62"/>
  <g stroke="#F2A93B" stroke-width="7" stroke-linecap="round">
    <line x1="230" y1="30" x2="230" y2="62"/>
    <line x1="230" y1="278" x2="230" y2="310"/>
    <line x1="90" y1="170" x2="122" y2="170"/>
    <line x1="338" y1="170" x2="370" y2="170"/>
    <line x1="131" y1="71" x2="154" y2="94"/>
    <line x1="306" y1="246" x2="329" y2="269"/>
    <line x1="329" y1="71" x2="306" y2="94"/>
    <line x1="154" y1="246" x2="131" y2="269"/>
  </g>

  <!-- roof deck -->
  <rect x="0" y="470" width="1200" height="160" fill="#101E30"/>
  <rect x="0" y="452" width="1200" height="18" fill="#152A42"/>
  <line x1="0" y1="452" x2="1200" y2="452" stroke="#2C4A6E" stroke-width="3"/>
  <!-- parapet corner -->
  <rect x="1080" y="360" width="120" height="110" fill="#152A42"/>
  <line x1="1080" y1="360" x2="1080" y2="470" stroke="#2C4A6E" stroke-width="3"/>
  <line x1="1080" y1="360" x2="1200" y2="360" stroke="#2C4A6E" stroke-width="3"/>

  <!-- condensing unit -->
  <rect x="600" y="240" width="360" height="212" rx="14" fill="#12233A" stroke="#2C4A6E" stroke-width="4"/>
  <!-- side louvers -->
  <g stroke="#1E3450" stroke-width="4">
    <line x1="624" y1="290" x2="744" y2="290"/>
    <line x1="624" y1="316" x2="744" y2="316"/>
    <line x1="624" y1="342" x2="744" y2="342"/>
    <line x1="624" y1="368" x2="744" y2="368"/>
    <line x1="624" y1="394" x2="744" y2="394"/>
    <line x1="624" y1="420" x2="744" y2="420"/>
  </g>
  <!-- fan guard -->
  <circle cx="860" cy="346" r="72" fill="#0F2036" stroke="#2C4A6E" stroke-width="4"/>
  <circle cx="860" cy="346" r="54" fill="none" stroke="#1E3450" stroke-width="3"/>
  <circle cx="860" cy="346" r="36" fill="none" stroke="#1E3450" stroke-width="3"/>
  <circle cx="860" cy="346" r="10" fill="#2C4A6E"/>
  <g stroke="#3A5C84" stroke-width="6" stroke-linecap="round">
    <path d="M860 346 q26 -30 12 -58"/>
    <path d="M860 346 q38 12 56 -8"/>
    <path d="M860 346 q-34 22 -60 6"/>
    <path d="M860 346 q-14 -38 -44 -44"/>
  </g>
  <!-- mounting rails -->
  <rect x="616" y="452" width="66" height="14" fill="#1E3450"/>
  <rect x="878" y="452" width="66" height="14" fill="#1E3450"/>
  <!-- refrigerant line set into the roof -->
  <path d="M600 420 h-96 q-20 0 -20 20 v30" fill="none" stroke="#6FD3EF" stroke-width="8" stroke-linecap="round"/>

  <!-- heat shimmering off the unit -->
  <g stroke="#F07B3F" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M800 218 q-14 -22 0 -44 q14 -22 0 -44"/>
    <path d="M860 226 q-14 -22 0 -44 q14 -22 0 -44"/>
    <path d="M920 218 q-14 -22 0 -44 q14 -22 0 -44"/>
  </g>
  <g stroke="#F2A93B" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M700 210 q-12 -18 0 -36 q12 -18 0 -36"/>
    <path d="M980 206 q-12 -18 0 -36 q12 -18 0 -36"/>
  </g>
  <!-- heat rising off the roof deck -->
  <g stroke="#F2A93B" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.35">
    <path d="M180 440 q-10 -16 0 -32 q10 -16 0 -32"/>
    <path d="M300 444 q-10 -16 0 -32 q10 -16 0 -32"/>
    <path d="M430 440 q-10 -16 0 -32 q10 -16 0 -32"/>
    <path d="M1120 340 q-10 -16 0 -32 q10 -16 0 -32"/>
  </g>

  <!-- air temp badge -->
  <rect x="440" y="86" width="256" height="104" rx="16" fill="#0F2036" stroke="#2C4A6E" stroke-width="3"/>
  <text x="470" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="46" font-weight="700" fill="#F2A93B">101&#176;F</text>
  <text x="470" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#7FA6BD">AFTERNOON AIR</text>
  <circle cx="646" cy="128" r="16" fill="none" stroke="#F2A93B" stroke-width="4"/>
  <g stroke="#F2A93B" stroke-width="4" stroke-linecap="round">
    <line x1="646" y1="100" x2="646" y2="108"/>
    <line x1="646" y1="148" x2="646" y2="156"/>
    <line x1="618" y1="128" x2="626" y2="128"/>
    <line x1="666" y1="128" x2="674" y2="128"/>
  </g>

  <!-- roof surface callout -->
  <circle cx="380" cy="500" r="6" fill="#F07B3F"/>
  <line x1="386" y1="500" x2="470" y2="552" stroke="#F07B3F" stroke-width="2"/>
  <text x="480" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3" fill="#F0B27F">ROOF DECK 130&#176;F+</text>

  <!-- unit callout -->
  <circle cx="948" cy="264" r="6" fill="#6FD3EF"/>
  <line x1="954" y1="264" x2="1030" y2="216" stroke="#6FD3EF" stroke-width="2"/>
  <text x="900" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3" fill="#9FD9EE">WORKING UPHILL</text>
</svg>
